services:
  db:
    container_name: postgres_db
    image: postgres:16
    restart: always
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=1234
      - POSTGRES_DB=summerstoredb
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_web
    restart: always
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@example.com
      - PGADMIN_DEFAULT_PASSWORD=adminpassword
    ports:
      - 5050:80
    depends_on:
      - db
  frontend:
    build:
      context: ./summer-store-app
      dockerfile: Dockerfile
    container_name: summer-store-client
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://backend:8080
    ports:
      - "3000:3000"

  backend:
      build:
        context: ./SummerStoreApi
        dockerfile: Dockerfile
      container_name: summer-store-server
      environment:
        - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=summerstoredb;Username=admin;Password=1234
        - StorageSettings__ImagesRootPath=/data/images
        - StorageSettings__AttachmentsRootPath=/data/attachments
        - StorageSettings__MaxFileSizeBytes=10485760

      restart: unless-stopped
      depends_on:
        - db
      ports:
        - 5000:8080
      volumes:
      - images:/data/images
      - attachments:/data/attachments
    
volumes:
  postgres_data:
  images:
  files:

    
    


